name: update-and-deploy

on:
  schedule:
    - cron: "30 21 * * *"   # 毎朝 6:30（日本時間）
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 区議会のページを取りに行く
        if: github.event_name != 'push'
        run: python scripts/fetch.py
      - name: 取得したデータを残す
        if: github.event_name != 'push'
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > data/last_checked.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/sessions data/last_checked.txt
          git commit -m "データ更新 $(date +%F)" || echo "変更なし"
          git push
      - id: pages
        uses: actions/configure-pages@v5
      - name: サイトを作る
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/build.py
      - name: まる見え大田区を /marumie/ に入れる
        run: cp -R marumie/docs site/marumie
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
